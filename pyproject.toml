[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentdsl-bench"
version = "0.1.0"
description = "Extensible operator correctness and performance comparisons"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/intent_bench/licenses/*.txt"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
torch = ["torch"]

[project.scripts]
intent-bench = "intent_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intent_bench = ["**/*.json", "**/*.mojo", "**/*.cpp", "**/*.c", "**/*.h", "**/*.cu", "**/*.cuh", "**/*.md", "licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
