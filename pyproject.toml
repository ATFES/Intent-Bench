[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentdsl-bench"
version = "0.2.0"
description = "Extensible operator correctness and performance comparisons"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/intent_bench/licenses/*.txt"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
compilerinfra = ["compilerinfra==0.3.2"]
test = ["pytest>=7"]
torch = ["torch"]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
intent-bench = "intent_bench.cli:main"
intent-bench-mcp = "intent_bench.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intent_bench = ["**/*.json", "**/*.mojo", "**/*.cpp", "**/*.c", "**/*.h", "**/*.cu", "**/*.mlu", "**/*.cuh", "**/*.md", "licenses/*.txt", "plugin/.mcp.json", "plugin/.codex-plugin/plugin.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
