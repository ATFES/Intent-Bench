name: test
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build
      - run: pytest
      - run: intent-bench list --json
      - run: intent-bench run examples/custom.py:bench --output /tmp/bench-custom
      - run: python -m build --wheel
