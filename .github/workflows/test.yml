name: test
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Configure output directory
        run: echo "INTENT_BENCH_OUTPUT_ROOT=$RUNNER_TEMP/intent-bench/output" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from a controlled build directory
        run: |
          mkdir -p "$INTENT_BENCH_OUTPUT_ROOT/build/source" "$INTENT_BENCH_OUTPUT_ROOT/work/tmp"
          rsync -a --exclude=.git --exclude=output ./ "$INTENT_BENCH_OUTPUT_ROOT/build/source/"
          TMPDIR="$INTENT_BENCH_OUTPUT_ROOT/work/tmp" python -m pip install "$INTENT_BENCH_OUTPUT_ROOT/build/source[test]" build
      - run: pytest --basetemp="$INTENT_BENCH_OUTPUT_ROOT/work/pytest" -o cache_dir="$INTENT_BENCH_OUTPUT_ROOT/cache/pytest"
      - run: intent-bench list --json
      - run: intent-bench run examples/custom.py:bench --impl mine
      - run: TMPDIR="$INTENT_BENCH_OUTPUT_ROOT/work/tmp" python -m build --wheel "$INTENT_BENCH_OUTPUT_ROOT/build/source" --outdir "$INTENT_BENCH_OUTPUT_ROOT/build/wheels"
